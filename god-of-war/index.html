<html>
  <head>
    <title>God Of War</title>
    <meta name="viewport" content="width=device-width initial-scale=1">
    <meta charset="UTF-8">
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
      }

      #main-container {
        display: grid;
        grid-template-columns: 1fr;
        grid-template-rows: 3fr 2fr;
        height: 100vh;
        width: 100vw;
        background: linear-gradient(white, #DAD);
      }

      #text-content {
        width: 100%;
        height: 100%;
      }

      h1 {
        width: 100%;
        margin: auto;
        text-align: center;
      }

      .img-carosel {
        display: grid;
        grid-template-rows: 9fr 1fr;
      }

      #img-carosel-images {
        height: 100%;
      }

      #img-carosel-images img {
        height: 100%;
        width: 100%;
        object-fit: contain;
      }

      .img-carosel-navigation {
        height: 100%;
        width: 100%;
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      @media (min-width: 768px) {
        #main-container {
          grid-template-columns: 1fr 2fr;
          grid-template-rows: 1fr;
        }

        .img-carosel {
          grid-template-rows: 25fr 1fr;
          background: black;
        }
      }
    </style>
  </head>
  <body>
    <div id="main-container">
      <div id="text-content">
        <h1>God Of War</h1>
      </div>
      <div class="img-carosel">
        <div id="img-carosel-images">
          <img src="g1.jpg" alt="">
          <img src="cover.png" alt="" style="display: none;">
        </div>
        <div class="img-carosel-navigation">
          <button type="button" onclick="caroselMove(-1)">&lt;</button>
          <button type="button" onclick="caroselMove(1)">&gt;</button>
        </div>
      </div>
    </div>

    <script>
      const caroselImages = document.getElementById('img-carosel-images')
      let caroselIndex = 0

      function caroselMove(direction) {
        if (!caroselImages) return
        caroselIndex += direction
        const length = Array.from(caroselImages.children).length
        if (caroselIndex < 0) caroselIndex = length - 1
        else if (caroselIndex >= length) caroselIndex = 0

        Array.from(caroselImages.children).forEach((child, index) => {
          child.style.display = "none"
          if (index === caroselIndex) child.style.display = "block"
        })
      }
    </script>
  </body>
</html>
