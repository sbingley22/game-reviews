<html>
  <head>
    <title>Game Reviews</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width; initial-scale=1.0;">
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        background: black;
        color: #EEE;
        margin: 0;
        padding: 0;
      }

      h3 {
        font-size: 22px;
        margin: 0;
        margin-bottom: 5px;
        padding: 0;
        font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        justify-items: center;
        text-align: center;
      }

      #head-container {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 10px;
      }

      #head-container button {
        background: none;
        color: gold;
      }

      h5 {
        font-size: 2rem;
        margin: 0;
        padding: 0;
        color: gold;
      }

      #main-container {
        background: #000;
        display: grid;
        grid-template-columns: repeat(auto-fit, 250px);
        grid-template-rows: 250px;
        gap: 10px;
        margin: 0;
        padding: 20px;
      }

      .game-container {
        position: relative;
        border: 2px solid #999;
        background: #111;
        color: #EEE;
        width: 100%;
        height: 100%;
        justify-items: center;
        align-content: space-between;
        padding: 0px;
        border-radius: 10px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .game-container:hover {
        cursor: pointer;
        border-color: #EEE;
      }

      .game-container img {
        width: 100%;
        object-fit: contain;
        margin: 0;
        padding: 0;
        flex: auto
      }

      .smiley::before {
        content: "😊";
        position: absolute;
        bottom: 0;
        right: 0;
        font-size: 2.0rem;
        background: black;
        border-radius: 5px;
        border: solid 3px gold;
        border: solid 3px green;
      }
      .sad::before {
        content: "☹️";
        position: absolute;
        bottom: 0;
        right: 0;
        font-size: 2.0rem;
        background: black;
        border-radius: 5px;
        border: solid 3px red;
      }
      .neutral::before {
        content: "😐";
        position: absolute;
        bottom: 0;
        right: 0;
        font-size: 2.0rem;
        background: black;
        border-radius: 5px;
        border: solid 3px grey;
      }

      @media (max-width: 768px) {
        #main-container {
          grid-template-columns: repeat(auto-fit, 100px);
          grid-template-rows: 150px;
        }

        h3 {
          font-size: 1rem;
        }

        .smiley::before {
          font-size: 1rem;
        }
        .sad::before {
          font-size: 1rem;
        }
        .neutral::before {
          font-size: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <header id="head-container">
      <h5>Sean's Game Reviews</h5>
      <div style="display: flex;">
        <p style="margin-right: 5px; color: gold;">Sort: </p>
        <button type="button" onclick="sortBy('name')">Name</button>
        <button type="button" onclick="sortBy('score')">Score</button>
      </div>
    </header>

    <div id="main-container">
      <a class="game-container" href="./1000-x-resist/index.html">
        <h3>1000xRESIST</h3>
        <img src="./1000-x-resist/cover.png"/>
        <span class="smiley" />
      </a>
      <a class="game-container" href="./baldurs-gate-3/index.html">
        <h3>Baldur's Gate 3</h3>
        <img src="./baldurs-gate-3/cover.png"/>
        <span class="smiley" />
      </a>
      <a class="game-container" href="./cyberpunk-2077/dist/index.html">
        <h3>Cyberpunk 2077</h3>
        <img src="./cyberpunk-2077/cover.png" alt="" />
        <span class="smiley" />
      </a>
      <a class="game-container" href="./disco-elysium/index.html">
        <h3>Disco Elysium</h3>
        <img src="./disco-elysium/cover.webp" alt="" />
        <span class="smiley" />
      </a>
      <a class="game-container" href="./elden-ring/index.html">
        <h3>Elden Ring</h3>
        <img src="./elden-ring/cover.png" alt="">
        <span class="smiley" />
      </a>
      <a class="game-container" href="./god-of-war/index.html">
        <h3>God Of War</h3>
        <img src="./god-of-war/cover.png" alt="">
        <span class="smiley" />
      </a>
      <a class="game-container" href="./heavy-rain/index.html">
        <h3>Heavy Rain</h3>
        <img src="./heavy-rain/cover.png" alt="">
        <span class="sad" />
      </a>
      <a class="game-container" href="./hollow-body/index.html">
        <h3>Hollow Body</h3>
        <img src="./hollow-body/cover.png" alt="">
        <span class="neutral" />
      </a>
      <a class="game-container" href="house-of-the-dead/house-of-the-dead.html">
        <h3>House of the Dead Overkill</h3>
        <img src="house-of-the-dead/cover.png" alt="">
        <span class="neutral" />
      </a>
      <a class="game-container" href="./paradise-killer/index.html">
        <h3>Paradise Killer</h3>
        <img src="./paradise-killer/cover.png" alt="">
        <span class="smiley" />
      </a>
      <a class="game-container" href="./resident-evil-revelations/index.html">
        <h3>Resident Evil Revelations</h3>
        <img src="./resident-evil-revelations/cover.png" alt="">
        <span class="smiley" />
      </a>
      <a class="game-container" href="./resident-evil-revelations-2/index.html">
        <h3>Resident Evil Revelations 2</h3>
        <img src="./resident-evil-revelations-2/cover.png" alt="">
        <span class="smiley" />
      </a>
      <a class="game-container" href="./rocket-league/index.html">
        <h3>Rocket League</h3>
        <img src="./rocket-league/cover.png" alt="">
        <span class="smiley" />
      </a>
      <a class="game-container" href="./signalis/index.html">
        <h3>Signalis</h3>
        <img src="./signalis/cover.png" alt="">
        <span class="smiley" />
      </a>
      <a class="game-container" href="./spiritfarer/index.html">
        <h3>Spiritfarer</h3>
        <img src="./spiritfarer/cover.png" alt="">
        <span class="smiley" />
      </a>
      <a class="game-container" href="./tekken-8/index.html">
        <h3>Tekken 8</h3>
        <img src="./tekken-8/cover.png" alt="">
        <span class="sad" />
      </a>
    </div>

    <script>
      const mainContainer = document.getElementById('main-container')

      function sortBy(sortType) {
        if (mainContainer) {
          // extract each game container child along with score and name to a new array
          const gameArray = []
          Array.from(mainContainer.children).forEach((child, index) => {
            let name = null
            let score = null
            Array.from(child.children).forEach(sub => {
              if (sub.localName === 'h3') name = sub.innerText
              else if (sub.localName === 'span') score = sub.className
            })
            gameArray.push({child, name, score})
          })

          // use array.sort function to reorder
          if (sortType === "name") {
            gameArray.sort((a, b) => {
              const nameA = a.name.toLowerCase()
              const nameB = b.name.toLowerCase()
              if (nameA < nameB) return -1
              if (nameA > nameB) return 1
              return 0
            })
          }
          else if (sortType === "score") {
            gameArray.sort((a, b) => {
              const scoreA = a.score === "smiley" ? 2 : a.score === "neutral" ? 1 : 0
              const scoreB = b.score === "smiley" ? 2 : b.score === "neutral" ? 1 : 0
              if (scoreA < scoreB) return 1
              if (scoreA > scoreB) return -1
              return 0
            })
          }

          // reappend each child in the new order
          gameArray.forEach(game => {
            mainContainer.appendChild(game.child)
          })
        }
      }
    </script>

  </body>
</html>
